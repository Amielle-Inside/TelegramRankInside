<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17212d"/>
      <stop offset="100%" stop-color="#131a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>

  <rect x="30" y="20" width="740" height="50" fill="#131a24" stroke="#25303d" stroke-width="1" rx="8"/>
  <text x="50" y="46" font-family="system-ui" font-size="14" font-weight="700" fill="#38bdf8">Ciclos</text>
  <text x="150" y="46" font-family="system-ui" font-size="13" fill="#94a3b8">Grupo: ████████████████</text>

  <!-- Ciclo ativo -->
  <g transform="translate(30, 90)">
    <rect width="740" height="120" fill="url(#card)" stroke="#25303d" stroke-width="1" rx="8"/>
    <text x="20" y="25" font-family="system-ui" font-size="13" font-weight="700" fill="#e7e6e5">Ciclo atual</text>
    <text x="20" y="50" font-family="system-ui" font-size="12" fill="#94a3b8">ID: ████████</text>
    <text x="20" y="72" font-family="system-ui" font-size="12" fill="#94a3b8">Iniciado em: dd/mm/yyyy</text>
    <text x="20" y="94" font-family="system-ui" font-size="12" fill="#94a3b8">Término estimado: dd/mm/yyyy HH:MM</text>
    <text x="300" y="50" font-family="system-ui" font-size="12" fill="#94a3b8">Participantes elegíveis: ██</text>
    <text x="300" y="72" font-family="system-ui" font-size="12" fill="#94a3b8">3 vagas de pódio por semana</text>
    <text x="300" y="94" font-family="system-ui" font-size="12" fill="#94a3b8">Ciclo encerra quando todos passarem pelo top 3</text>
  </g>

  <!-- Rodadas -->
  <g transform="translate(30, 230)">
    <rect width="740" height="100" fill="url(#card)" stroke="#25303d" stroke-width="1" rx="8"/>
    <text x="20" y="25" font-family="system-ui" font-size="13" font-weight="700" fill="#e7e6e5">Últimas rodadas</text>
    <rect x="20" y="45" width="700" height="26" fill="#0f172a" stroke="#25303d" stroke-width="1" rx="4"/>
    <text x="30" y="64" font-family="system-ui" font-size="11" fill="#64748b">Semana</text>
    <text x="200" y="64" font-family="system-ui" font-size="11" fill="#64748b">Estado</text>
    <text x="40" y="90" font-family="system-ui" font-size="12" fill="#e7e6e5">2026-11-16</text>
    <text x="200" y="90" font-family="system-ui" font-size="12" fill="#22c55e">● Encerrada</text>
    <text x="40" y="116" font-family="system-ui" font-size="12" fill="#e7e6e5">2026-11-09</text>
    <text x="200" y="116" font-family="system-ui" font-size="12" fill="#22c55e">● Encerrada</text>
  </g>

  <!-- Filtros ciclos -->
  <g transform="translate(30, 350)">
    <rect width="740" height="100" fill="url(#card)" stroke="#25303d" stroke-width="1" rx="8"/>
    <text x="20" y="25" font-family="system-ui" font-size="13" font-weight="700" fill="#38bdf8">Filtro avançado — Ciclos</text>
    <text x="20" y="55" font-family="system-ui" font-size="12" fill="#94a3b8">Estado:</text>
    <rect x="70" y="40" width="120" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="210" y="55" font-family="system-ui" font-size="12" fill="#94a3b8">Início de / até:</text>
    <rect x="330" y="40" width="100" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <rect x="440" y="40" width="100" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="20" y="90" font-family="system-ui" font-size="12" fill="#94a3b8">Participantes ≥:</text>
    <rect x="120" y="75" width="80" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="220" y="90" font-family="system-ui" font-size="12" fill="#94a3b8">Pódios ≥:</text>
    <rect x="280" y="75" width="80" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
  </g>
</svg>
