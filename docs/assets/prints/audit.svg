    <rect x="480" y="40" width="120" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
  </g>

  <!-- Log de auditoria -->
  <g transform="translate(30, 210)">
    <rect width="740" height="260" fill="url(#card)" stroke="#25303d" stroke-width="1" rx="8"/>
    <text x="20" y="25" font-family="system-ui" font-size="13" font-weight="700" fill="#e7e6e5">Log de auditoria — !check</text>
    <rect x="20" y="45" width="700" height="26" fill="#0f172a" stroke="#25303d" stroke-width="1" rx="4"/>
    <text x="30" y="64" font-family="system-ui" font-size="11" fill="#64748b">Data/Hora</text>
    <text x="180" y="64" font-family="system-ui" font-size="11" fill="#64748b">Usuário</text>
    <text x="280" y="64" font-family="system-ui" font-size="11" fill="#64748b">Comando</text>
    <text x="390" y="64" font-family="system-ui" font-size="11" fill="#64748b">Auditado?</th>
    <text x="470" y="64" font-family="system-ui" font-size="11" fill="#64748b">Resultado</text>
    <text x="560" y="64" font-family="system-ui" font-size="11" fill="#64748b">Pontos</text>
    <text x="40" y="90" font-family="system-ui" font-size="12" fill="#e7e6e5">dd/mm/yyyy HH:MM</text>
    <text x="170" y="90" font-family="system-ui" font-size="12" fill="#e7e6e5">████████</text>
