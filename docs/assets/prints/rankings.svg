<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17212d"/>
      <stop offset="100%" stop-color="#131a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>

  <!-- Nav -->
  <rect x="30" y="20" width="740" height="50" fill="#131a24" stroke="#25303d" stroke-width="1" rx="8"/>
  <text x="50" y="46" font-family="system-ui" font-size="14" font-weight="700" fill="#38bdf8">Rankings</text>
  <text x="150" y="46" font-family="system-ui" font-size="13" fill="#94a3b8">Grupo: ████████████████</text>
  <text x="320" y="46" font-family="system-ui" font-size="13" fill="#94a3b8">Semana: 2026-11-16</text>

  <!-- Filtro avançado -->
  <g transform="translate(30, 90)">
    <rect width="740" height="130" fill="url(#card)" stroke="#25303d" stroke-width="1" rx="8"/>
    <text x="20" y="25" font-family="system-ui" font-size="13" font-weight="700" fill="#38bdf8">Filtro avançado — Ranking</text>
    <text x="20" y="55" font-family="system-ui" font-size="12" fill="#94a3b8">Posição exata:</text>
    <rect x="120" y="40" width="120" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="128" y="58" font-family="system-ui" font-size="12" fill="#e7e6e5">ex: 5</text>
    <text x="260" y="55" font-family="system-ui" font-size="12" fill="#94a3b8">Posição ≥ / ≤:</text>
    <rect x="360" y="40" width="60" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <rect x="430" y="40" width="60" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="510" y="55" font-family="system-ui" font-size="12" fill="#94a3b8">Usuário contém:</text>
    <rect x="610" y="40" width="110" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="20" y="90" font-family="system-ui" font-size="12" fill="#94a3b8">ID exato:</text>
    <rect x="60" y="75" width="120" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="200" y="90" font-family="system-ui" font-size="12" fill="#94a3b8">Pontos ≥ / ≤:</text>
    <rect x="290" y="75" width="60" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <rect x="360" y="75" width="60" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <rect x="620" y="80" width="140" height="30" fill="#38bdf8" rx="4"/>
    <text x="690" y="99" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#0b1016">Aplicar</text>
  </g>

  <!-- Pódio -->
  <g transform="translate(30, 240)">
    <rect width="740" height="100" fill="url(#card)" stroke="#25303d" stroke-width="1" rx="8"/>
    <text x="20" y="25" font-family="system-ui" font-size="14" font-weight="700" fill="#e7e6e5">Prévia do pódio semanal</text>
    <circle cx="70" cy="65" r="18" fill="#fbbf24"/>
    <text x="70" y="70" text-anchor="middle" font-family="system-ui" font-size="16" fill="#0b1016">🥇</text>
    <text x="100" y="55" font-family="system-ui" font-size="13" font-weight="700" fill="#e7e6e5">#1 — ████████</text>
    <text x="100" y="75" font-family="system-ui" font-size="12" fill="#38bdf8">██████.█ pts</text>
    <circle cx="240" cy="75" r="14" fill="#94a3b8"/>
    <text x="240" y="80" text-anchor="middle" font-family="system-ui" font-size="16" fill="#0b1016">🥈</text>
    <text x="270" y="65" font-family="system-ui" font-size="13" font-weight="700" fill="#e7e6e5">#2 — ████████</text>
    <text x="270" y="85" font-family="system-ui" font-size="12" fill="#38bdf8">██████.█ pts</text>
    <circle cx="410" cy="85" r="11" fill="#b45309"/>
    <text x="410" y="90" text-anchor="middle" font-family="system-ui" font-size="16" fill="#0b1016">🥉</text>
    <text x="440" y="75" font-family="system-ui" font-size="13" font-weight="700" fill="#e7e6e5">#3 — ████████</text>
    <text x="440" y="95" font-family="system-ui" font-size="12" fill="#38bdf8">██████.█ pts</text>
  </g>

  <!-- Top 10 -->
  <g transform="translate(30, 360)">
    <rect width="740" height="110" fill="url(#card)" stroke="#25303d" stroke-width="1" rx="8"/>
    <text x="20" y="25" font-family="system-ui" font-size="14" font-weight="700" fill="#e7e6e5">Top 10 — Semana 2026-11-16</text>
    <rect x="20" y="40" width="700" height="26" fill="#0f172a" stroke="#25303d" stroke-width="1" rx="4"/>
    <text x="30" y="60" font-family="system-ui" font-size="11" fill="#64748b">Posição</text>
    <text x="100" y="60" font-family="system-ui" font-size="11" fill="#64748b">Usuário</text>
    <text x="220" y="60" font-family="system-ui" font-size="11" fill="#64748b">ID</text>
    <text x="320" y="60" font-family="system-ui" font-size="11" fill="#64748b">Pontos</text>
    <text x="40" y="88" font-family="system-ui" font-size="12" fill="#e7e6e5">1</text>
    <text x="90" y="88" font-family="system-ui" font-size="12" fill="#e7e6e5">████████</text>
    <text x="210" y="88" font-family="system-ui" font-size="12" fill="#e7e6e5">██████████</text>
    <text x="310" y="88" font-family="system-ui" font-size="12" fill="#38bdf8" font-weight="700">██████.█</text>
    <text x="40" y="114" font-family="system-ui" font-size="12" fill="#e7e6e5">2</text>
    <text x="90" y="114" font-family="system-ui" font-size="12" fill="#e7e6e5">████████</text>
    <text x="210" y="114" font-family="system-ui" font-size="12" fill="#e7e6e5">██████████</text>
    <text x="310" y="114" font-family="system-ui" font-size="12" fill="#38bdf8" font-weight="700">██████.█</text>
  </g>
</svg>
