<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17212d"/>
      <stop offset="100%" stop-color="#131a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>

  <rect x="30" y="20" width="740" height="50" fill="#131a24" stroke="#25303d" stroke-width="1" rx="8"/>
  <text x="50" y="46" font-family="system-ui" font-size="14" font-weight="700" fill="#38bdf8">Módulos</text>

  <!-- Lista de módulos -->
  <g transform="translate(30, 90)">
    <rect width="740" height="360" fill="url(#card)" stroke="#25303d" stroke-width="1" rx="8"/>
    <text x="20" y="25" font-family="system-ui" font-size="13" font-weight="700" fill="#e7e6e5">Módulos instalados</text>
    <rect x="20" y="45" width="700" height="26" fill="#0f172a" stroke="#25303d" stroke-width="1" rx="4"/>
    <text x="30" y="64" font-family="system-ui" font-size="11" fill="#64748b">ID</text>
    <text x="150" y="64" font-family="system-ui" font-size="11" fill="#64748b">Versão</text>
    <text x="240" y="64" font-family="system-ui" font-size="11" fill="#64748b">Estado</text>
    <text x="330" y="64" font-family="system-ui" font-size="11" fill="#64748b">Comandos</text>

    <text x="30" y="90" font-family="system-ui" font-size="12" fill="#e7e6e5">ranking</text>
    <text x="140" y="90" font-family="system-ui" font-size="12" fill="#e7e6e5">1.1.0</text>
    <rect x="220" y="78" width="80" height="20" fill="rgba(34,197,94,0.15)" rx="4"/>
    <text x="260" y="91" text-anchor="middle" font-family="system-ui" font-size="11" fill="#22c55e" font-weight="700">Ativo</text>
    <text x="320" y="90" font-family="system-ui" font-size="12" fill="#e7e6e5">!rank, !rciclo, !pontos, !posicao, !historico, !regras, !ajuda, !status, !check, !stop, !reboot</text>

    <text x="30" y="120" font-family="system-ui" font-size="12" fill="#e7e6e5">snapshots</text>
    <text x="140" y="120" font-family="system-ui" font-size="12" fill="#e7e6e5">1.0.0</text>
    <rect x="220" y="108" width="80" height="20" fill="rgba(34,197,94,0.15)" rx="4"/>
    <text x="260" y="121" text-anchor="middle" font-family="system-ui" font-size="11" fill="#22c55e" font-weight="700">Ativo</text>
    <text x="320" y="120" font-family="system-ui" font-size="12" fill="#e7e6e5">Snapshot semanal automático</text>

    <text x="30" y="150" font-family="system-ui" font-size="12" fill="#e7e6e5">audit</text>
    <text x="140" y="150" font-family="system-ui" font-size="12" fill="#e7e6e5">1.0.0</text>
    <rect x="220" y="138" width="80" height="20" fill="rgba(34,197,94,0.15)" rx="4"/>
    <text x="260" y="151" text-anchor="middle" font-family="system-ui" font-size="11" fill="#22c55e" font-weight="700">Ativo</text>
    <text x="320" y="150" font-family="system-ui" font-size="12" fill="#e7e6e5">Log de !check e eventos de auditoria</text>

    <text x="30" y="180" font-family="system-ui" font-size="12" fill="#e7e6e5">web</text>
    <text x="140" y="180" font-family="system-ui" font-size="12" fill="#e7e6e5">1.0.0</text>
    <rect x="220" y="168" width="80" height="20" fill="rgba(34,197,94,0.15)" rx="4"/>
    <text x="260" y="181" text-anchor="middle" font-family="system-ui" font-size="11" fill="#22c55e" font-weight="700">Ativo</text>
    <text x="320" y="180" font-family="system-ui" font-size="12" fill="#e7e6e5">Painel administrativo web (localhost)</text>
  </g>

  <!-- Versioneamento -->
  <g transform="translate(30, 470)">
    <rect width="740" height="20" fill="none"/>
    <text x="20" y="0" font-family="system-ui" font-size="11" fill="#64748b">Versionamento dinâmico via arquivo VERSION — não mais estático em 1.0</text>
  </g>
</svg>
